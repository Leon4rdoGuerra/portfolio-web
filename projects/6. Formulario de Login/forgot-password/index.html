<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Forgot password</title>
</head>
<body>
    <form class="forgot-form">
        <h2 class="form-heading">Olvidaste la Contraseña</h2>
        <label class="input-container">
            <input class="email" type="text" placeholder=" " autocomplete="new-password" required>
            <span class="placeholder">Correo Electronico</span>
            <svg class="email-icon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" transform="" id="injected-svg" xmlns="http://www.w3.org/2000/svg"><!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free--><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 2v.51l-8 6.22-8-6.22V6zM4 18V9.04l7.39 5.74c.18.14.4.21.61.21s.43-.07.61-.21L20 9.03v8.96H4Z"></path></svg>
        </label>        
        <input type="submit" class="enviar" value="Enviar Codigo">
        <span class="login">¿Recordaste la contraseña? <a href="../login/index.html">Inicia Sesion</a></span>
        <span class="sing-up">¿No tienes cuenta? <a href="../sign-up/index.html">Registrate</a></span>
        <div class="overlay"></div>
        <div class="modal-exito">
            <h2 class="modal-heading">Revise su Email</h2>
            <button type="button" class="quit">Aceptar</button>
        </div>
    </form>
</body>
</html>
